[package]
name = "tcp-trace"
version = "0.1.0"
edition = "2021"
description = "Inspect TCP connections from pcap files or live captures in a DevTools-style web UI."
license = "MIT"

[dependencies]
argh = "0.1"
axum = "0.8"
base64 = "0.22"
etherparse = "0.18"
flate2 = "1"
mime_guess = "2"
open = "5"
pcap-parser = { version = "0.17", features = ["data"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "tcp-trace"
path = "src/main.rs"
